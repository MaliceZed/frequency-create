plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

repositories {
    // maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.createmod.net" }
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" } // REI
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.terraformersmc.com/releases" } // EMI
}

version = '0.1.6'
base.archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"

ext {
    rei_version = "16.0.788"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java {
    exclude 'maze/frequency/compat_disabled/**'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = "21.1.219"

    runs {
        client {
            client()
            programArguments.addAll '--username', project.findProperty('username') ?: 'MaliceZed'
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath)
        }

        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        frequency {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
	//compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+62"
	implementation "com.simibubi.create:create-1.21.1:6.0.11-292"
	// Create is a runtime dependency (defined in neoforge.mods.toml)
	// Compile-time integration uses reflection in CreateCompat

	// ═══════════════════════════════════════════════════════════════════
	// Optional JEI / EMI / REI integrations (compile-only).
	// Uncomment the lines below if you need to compile the compat classes.
	// ═══════════════════════════════════════════════════════════════════
	//
	// JEI  — https://www.curseforge.com/minecraft/mc-mods/jei
	compileOnly "mezz.jei:jei-1.21.1-common-api:19.27.0.340"
	compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340"
	runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.27.0.340"
	//
	// EMI  — https://www.curseforge.com/minecraft/mc-mods/emi
	compileOnly "dev.emi:emi-neoforge:1.1.14+1.21.1:api"
	// runtimeOnly "dev.emi:emi-neoforge:1.1.14+1.21.1"
	//
	// REI  — https://www.curseforge.com/minecraft/mc-mods/roughly-enough-items
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
	// runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def modVersion = version
    inputs.property 'version', modVersion

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': modVersion
    }
}
